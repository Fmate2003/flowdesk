# A docker stack deploy a 3.x Compose formátumot kezeli.
version: "3.8"

services:
  frontend:
    image: flowdesk-frontend:3.0
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - webnet
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 4s
      retries: 3

  backend:
    image: flowdesk-backend:2.0
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: tasksdb
      DB_USER: todo_user
      DB_PASSWORD_FILE: /run/secrets/todo_db_password
    secrets:
      - todo_db_password
    networks:
      - webnet
      - dbnet
    deploy:
      replicas: 3
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      start_period: 35s
      retries: 3

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasksdb
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD_FILE: /run/secrets/todo_db_password
    secrets:
      - todo_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dbnet
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d tasksdb"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  webnet:
    driver: overlay
  dbnet:
    driver: overlay

volumes:
  postgres_data:

secrets:
  todo_db_password:
    external: true
